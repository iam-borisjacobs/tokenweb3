---
deployment:
  tasks:
    - export DEPLOYPATH=/home/maxihold/tokenweb3network.com/
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/mkdir -p $DEPLOYPATH/storage/logs $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/cache $DEPLOYPATH/bootstrap/cache $DEPLOYPATH/public/storage 2>/dev/null || true
    - /bin/cp -R storage/app/public/* $DEPLOYPATH/public/storage/ 2>/dev/null || true
    - /bin/mkdir -p $DEPLOYPATH/public/storage/photos $DEPLOYPATH/storage/app/public/photos 2>/dev/null || true
    - /bin/cp -rf $DEPLOYPATH/public/themes/ecx/assets/images/plans/* $DEPLOYPATH/public/storage/photos/ 2>/dev/null || true
    - /bin/cp -rf $DEPLOYPATH/public/themes/ecx/assets/images/plans/* $DEPLOYPATH/storage/app/public/photos/ 2>/dev/null || true
    - /bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache $DEPLOYPATH/public/storage 2>/dev/null || true
    - /bin/chmod -R 755 $DEPLOYPATH/temp $DEPLOYPATH/volkovdesign $DEPLOYPATH/admiro $DEPLOYPATH/public 2>/dev/null || true
    - /usr/local/bin/php $DEPLOYPATH/artisan storage:link 2>/dev/null || php $DEPLOYPATH/artisan storage:link 2>/dev/null || true
    - /usr/local/bin/php $DEPLOYPATH/artisan migrate --force 2>/dev/null || php $DEPLOYPATH/artisan migrate --force 2>/dev/null || true
    - /usr/local/bin/php $DEPLOYPATH/artisan view:clear 2>/dev/null || php $DEPLOYPATH/artisan view:clear 2>/dev/null || true
    - /usr/local/bin/php $DEPLOYPATH/artisan config:clear 2>/dev/null || php $DEPLOYPATH/artisan config:clear 2>/dev/null || true
    - /usr/local/bin/php $DEPLOYPATH/artisan route:clear 2>/dev/null || php $DEPLOYPATH/artisan route:clear 2>/dev/null || true

<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds - Fintech Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/fontawesome-min.css">
    <link rel="stylesheet" href="../assets/css/fintech-custom.css">
    <style>
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--secondary-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: #f8fafc;
            color: var(--text-main);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
        }

        .row {
            display: flex;
            margin: 0 -10px;
        }

        .col {
            flex: 1;
            padding: 0 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #2c3a96;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile-snippet">
                    <div class="user-avatar"><img src="../assets/images/dashboard/1.png" alt="User"
                            onerror="this.src='https://via.placeholder.com/40'"></div>
                    <div class="user-info">
                        <h4>JohnDoe</h4>
                        <p>john.doe@example.com</p>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa fa-th-large"></i> <span>Dashboard</span></a>
                <a href="deposit.html" class="nav-item"><i class="fa fa-wallet"></i> <span>Deposit Funds</span></a>
                <a href="withdraw.html" class="nav-item active"><i class="fa fa-money-bill-wave"></i> <span>Withdraw
                        Funds</span></a>
                <a href="buy-giftcards.html" class="nav-item"><i class="fa fa-shopping-bag"></i> <span>Buy Gift
                        Cards</span></a>
                <a href="sell-giftcards.html" class="nav-item"><i class="fa fa-tags"></i> <span>Sell Gift
                        Cards</span></a>
                <a href="crypto.html" class="nav-item"><i class="fa fa-bitcoin"></i> <span>Crypto Withdraw</span></a>
                <div style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                    <a href="support.html" class="nav-item"><i class="fa fa-headset"></i> <span>Support</span></a>
                    <a href="#" class="nav-item"><i class="fa fa-sign-out-alt"></i> <span>Logout</span></a>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
                    <div class="balance-card">
                        <span class="balance-label">Total Balance</span>
                        <span class="balance-amount">$12,450.75</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn"><i class="fa fa-bell"></i></button>
                    <div class="btn-header-action">Settings</div>
                </div>
            </header>

            <main class="page-body">
                <div class="page-title-row">
                    <h2 class="page-title">Withdraw Funds</h2>
                </div>

                <div class="card" style="max-width: 800px;">
                    <div style="margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <span style="font-weight: 600; color: var(--secondary-color);">Withdraw / Wallet</span>
                    </div>

                    <form>
                        <div class="form-group">
                            <label class="form-label">Select Wallet</label>
                            <select class="form-control">
                                <option>$8,520.50 - USD Wallet</option>
                                <option>0.5 BTC - Bitcoin Wallet</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Select Bank</label>
                            <select class="form-control">
                                <option>Chase Bank</option>
                                <option>Bank of America</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col">
                                <div class="form-group">
                                    <label class="form-label">Account Number</label>
                                    <input type="text" class="form-control" value="... 5678" readonly>
                                </div>
                            </div>
                            <div class="col">
                                <div class="form-group">
                                    <label class="form-label">Routing Number</label>
                                    <input type="text" class="form-control" value="***** *****" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Withdrawal Method (Calculated ID)</label>
                            <input type="text" class="form-control" value="$863.TwpEZ7s0himQvlecm,pWhmgRWNi," readonly
                                style="color: #888;">
                        </div>

                        <button type="submit" class="btn-primary">Submit Withdrawal Request</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script>function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }</script>
</body>

</html>

name: Deploy to cPanel on Push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Changes to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install LFTP Engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Sync Files to cPanel via LFTP
        run: |
          lftp -e "
          set ftp:ssl-allow false;
          set ftp:passive-mode true;
          set net:timeout 30;
          set net:max-retries 3;
          open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse --only-newer --verbose \
            --exclude-glob .git/ \
            --exclude-glob .git/** \
            --exclude-glob .github/ \
            --exclude-glob .github/** \
            --exclude-glob node_modules/ \
            --exclude-glob node_modules/** \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/app/public/uploads/** \
            --exclude-glob storage/logs/** \
            ./ token.flutranglobal.com/;
          bye
          "
